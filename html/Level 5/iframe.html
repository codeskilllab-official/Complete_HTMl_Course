<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iframe Tag</title>
  </head>
  <body>
    <h2>iframe Tag</h2>
    <iframe
      width="500"
      height="300"
      src="https://www.youtube.com/embed/XZwBNDGuWGU"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      allowfullscreen
    ></iframe>
    <iframe
      src="https://en.wikipedia.org/wiki/Sinking_of_SS_Princess_Alice"
      width="300"
      height="300"
    ></iframe>

   <iframe
  src="https://www.google.com/maps/embed"
  width="300"
  height="300"
  style="border:0"
  loading="lazy"
  allowfullscreen>
</iframe>
  </body>
</html>
